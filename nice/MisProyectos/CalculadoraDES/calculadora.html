<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora DES - Red de Feistel Paso a Paso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-dark: #0a0a0c;
            --text-white: #ffffff;
            --text-gray: #a1a1aa;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            margin: 0;
        }

        /* --- LUCES DE FONDO (GLOWS) --- */
        .background-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.12;
            z-index: -1;
            animation: float 10s infinite ease-in-out;
        }

        .glow-1 {
            top: -100px;
            left: -100px;
            background: var(--accent-blue);
        }

        .glow-2 {
            bottom: -100px;
            right: -100px;
            background: var(--accent-purple);
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 60px); }
        }

        /* --- VOLVER LINK --- */
        .nav-header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 25px;
            display: flex;
            justify-content: flex-start;
            z-index: 1;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--accent-blue);
            transform: translateX(-4px);
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            font-size: 1.8rem;
            margin-bottom: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
        }
        .calculator-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .calculator-header .subtitle {
            font-size: 1rem;
            color: var(--text-gray);
        }

        /* --- MODO DE ENTRADA --- */
        .mode-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .selector-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .segmented-control {
            display: flex;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            padding: 5px;
            border-radius: 50px;
            width: 100%;
            max-width: 550px;
            position: relative;
            backdrop-filter: blur(5px);
        }
        .segmented-control input[type="radio"] {
            display: none;
        }
        .segmented-control label {
            flex: 1;
            text-align: center;
            padding: 10px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-gray);
            font-weight: 500;
        }
        .segmented-control input[type="radio"]:checked + label {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #0a0a0c;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
        }

        /* --- INPUT GROUP --- */
        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .input-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-hint {
            font-size: 0.75rem;
            color: var(--text-gray);
            font-weight: normal;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrapper input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 10, 12, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: var(--text-white);
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-wrapper input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
            background: rgba(10, 10, 12, 0.8);
        }

        /* --- BUTTON --- */
        .btn-run {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: var(--text-white);
            font-weight: 600;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
            margin-bottom: 35px;
        }
        .btn-run:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
        }
        .btn-run:active {
            transform: translateY(1px);
        }

        /* --- RESULTS TABLE --- */
        .results-container {
            margin-top: 10px;
        }
        .results-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-purple);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(10, 10, 12, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: rgba(255, 255, 255, 0.01);
            color: var(--accent-cyan);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--text-white);
            vertical-align: middle;
        }
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* --- BADGES & HIGHLIGHTS --- */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
        }
        .badge-start {
            background: rgba(6, 182, 212, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.25);
        }
        .badge-end {
            background: rgba(139, 92, 246, 0.12);
            color: var(--accent-purple);
            border: 1px solid rgba(139, 92, 246, 0.25);
        }
        .round-num {
            color: var(--text-gray);
            font-weight: 600;
            padding-left: 8px;
        }
        .empty-val {
            color: rgba(255, 255, 255, 0.2);
            font-style: italic;
        }
        .key-val {
            color: #f9e2af;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .container {
                padding: 25px 20px;
            }
            .input-group {
                flex-direction: column;
                gap: 20px;
            }
            th, td {
                padding: 12px 14px;
                font-size: 0.8rem;
            }
            .calculator-header h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>

    <div class="nav-header">
        <a href="../index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al Portafolio</a>
    </div>

    <div class="container">
        <header class="calculator-header">
            <div class="icon-container">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2>Calculadora DES</h2>
            <p class="subtitle">Análisis del cifrado paso a paso por Ronda (Red de Feistel)</p>
        </header>
        
        <!-- Selector de Modo de Entrada (Hexadecimal vs Texto ASCII) -->
        <div class="mode-selector">
            <span class="selector-title"><i class="fa-solid fa-sliders"></i> Modo de Entrada</span>
            <div class="segmented-control">
                <input type="radio" id="mode-hex" name="inputMode" value="hex" checked onchange="changeInputMode('hex')">
                <label for="mode-hex">Hexadecimal (16 caracteres)</label>

                <input type="radio" id="mode-ascii" name="inputMode" value="ascii" onchange="changeInputMode('ascii')">
                <label for="mode-ascii">Texto ASCII (8 caracteres)</label>
            </div>
        </div>

        <div class="input-group">
            <div class="input-box">
                <label id="labelPlaintext" for="plaintext">
                    <i class="fa-solid fa-hashtag"></i> Texto Plano <span class="input-hint">(Hex - 16 caracteres)</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="plaintext" maxlength="16" value="0123456789ABCDEF" 
                           oninput="this.value = this.value.replace(/[^0-9a-fA-F]/g, '')" 
                           placeholder="Ej: 0123456789abcdef">
                </div>
            </div>
            <div class="input-box">
                <label id="labelKey" for="key">
                    <i class="fa-solid fa-key"></i> Clave <span class="input-hint">(Hex - 16 caracteres)</span>
                </label>
                <div class="input-wrapper">
                    <input type="text" id="key" maxlength="16" value="133457799BBCDFF1" 
                           oninput="this.value = this.value.replace(/[^0-9a-fA-F]/g, '')" 
                           placeholder="Ej: 133457799bbcdff1">
                </div>
            </div>
        </div>

        <button class="btn-run" onclick="calcularDES()">
            <i class="fa-solid fa-play"></i> Ejecutar Algoritmo
        </button>

        <div class="results-container">
            <h3 class="results-title"><i class="fa-solid fa-list-check"></i> Rondas del Proceso</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Ronda</th>
                            <th>L(i) [32 bits]</th>
                            <th>R(i) [32 bits]</th>
                            <th>K(i) [48 bits]</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTable">
                        <!-- Resultados generados por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
    // Tablas de Permutación y Cajas-S (Mismas tablas del algoritmo oficial)
    const IP = [
        58,50,42,34,26,18,10,2, 60,52,44,36,28,20,12,4,
        62,54,46,38,30,22,14,6, 64,56,48,40,32,24,16,8,
        57,49,41,33,25,17,9,1,  59,51,43,35,27,19,11,3,
        61,53,45,37,29,21,13,5, 63,55,47,39,31,23,15,7
    ];
    
    const PC1 = [
        57,49,41,33,25,17,9,  1,58,50,42,34,26,18,
        10,2,59,51,43,35,27,  19,11,3,60,52,44,36,
        63,55,47,39,31,23,15, 7,62,54,46,38,30,22,
        14,6,61,53,45,37,29,  21,13,5,28,20,12,4
    ];

    const PC2 = [
        14,17,11,24,1,5,   3,28,15,6,21,10,
        23,19,12,4,26,8,   16,7,27,20,13,2,
        41,52,31,37,47,55, 30,40,51,45,33,48,
        44,49,39,56,34,53, 46,42,50,36,29,32
    ];

    const SHIFTS = [1,1,2,2,2,2,2,2,1,2,2,2,2,2,2,1];

    const E_BOX = [
        32,1,2,3,4,5,     4,5,6,7,8,9,
        8,9,10,11,12,13,  12,13,14,15,16,17,
        16,17,18,19,20,21,20,21,22,23,24,25,
        24,25,26,27,28,29,28,29,30,31,32,1
    ];

    const P_BOX = [
        16,7,20,21, 29,12,28,17, 1,15,23,26, 5,18,31,10,
        2,8,24,14,  32,27,3,9,   19,13,30,6, 22,11,4,25
    ];

    const S_BOXES = [
        [14,4,13,1,2,15,11,8,3,10,6,12,5,9,0,7, 0,15,7,4,14,2,13,1,10,6,12,11,9,5,3,8, 4,1,14,8,13,6,2,11,15,12,9,7,3,10,5,0, 15,12,8,2,4,9,1,7,5,11,3,14,10,0,6,13],
        [15,1,8,14,6,11,3,4,9,7,2,13,12,0,5,10, 3,13,4,7,15,2,8,14,12,0,1,10,6,9,11,5, 0,14,7,11,10,4,13,1,5,8,12,6,9,3,2,15, 13,8,10,1,3,15,4,2,11,6,7,12,0,5,14,9],
        [10,0,9,14,6,3,15,5,1,13,12,7,11,4,2,8, 13,7,0,9,3,4,6,10,2,8,5,14,12,11,15,1, 13,6,4,9,8,15,3,0,11,1,2,12,5,10,14,7, 1,10,13,0,6,9,8,7,4,15,14,3,11,5,2,12],
        [7,13,14,3,0,6,9,10,1,2,8,5,11,12,4,15, 13,8,11,5,6,15,0,3,4,7,2,12,1,10,14,9, 10,6,9,0,12,11,7,13,15,1,3,14,5,2,8,4, 3,15,0,6,10,1,13,8,9,4,5,11,12,7,2,14],
        [2,12,4,1,7,10,11,6,8,5,3,15,13,0,14,9, 14,11,2,12,4,7,13,1,5,0,15,10,3,9,8,6, 4,2,1,11,10,13,7,8,15,9,12,5,6,3,0,14, 11,8,12,7,1,14,2,13,6,15,0,9,10,4,5,3],
        [12,1,10,15,9,2,6,8,0,13,3,4,14,7,5,11, 10,15,4,2,7,12,9,5,6,1,13,14,0,11,3,8, 9,14,15,5,2,8,12,3,7,0,4,10,1,13,11,6, 4,3,2,12,9,5,15,10,11,14,1,7,6,0,8,13],
        [4,11,2,14,15,0,8,13,3,12,9,7,5,10,6,1, 13,0,11,7,4,9,1,10,14,3,5,12,2,15,8,6, 1,4,11,13,12,3,7,14,10,15,6,8,0,5,9,2, 6,11,13,8,1,4,10,7,9,5,0,15,14,2,3,12],
        [13,2,8,4,6,15,11,1,10,9,3,14,5,0,12,7, 1,15,13,8,10,3,7,4,12,5,6,11,0,14,9,2, 7,11,4,1,9,12,14,2,0,6,10,13,15,3,5,8, 2,1,14,7,4,10,8,13,15,12,9,0,3,5,6,11]
    ];

    function hexToBin(hex) {
        let bin = '';
        for(let i=0; i<hex.length; i++) {
            bin += parseInt(hex[i], 16).toString(2).padStart(4, '0');
        }
        return bin;
    }

    function binToHex(bin) {
        let hex = '';
        for(let i=0; i<bin.length; i+=4) {
            hex += parseInt(bin.substring(i, i+4), 2).toString(16).toUpperCase();
        }
        return hex;
    }

    function permute(inputBin, table) {
        let output = '';
        for(let i=0; i<table.length; i++) {
            output += inputBin[table[i] - 1];
        }
        return output;
    }

    function xor(bin1, bin2) {
        let res = '';
        for(let i=0; i<bin1.length; i++) {
            res += (bin1[i] === bin2[i]) ? '0' : '1';
        }
        return res;
    }

    function leftShift(bin, shifts) {
        return bin.substring(shifts) + bin.substring(0, shifts);
    }

    function applySBoxes(input48) {
        let output32 = '';
        for(let i=0; i<8; i++) {
            let chunk = input48.substring(i*6, (i*6)+6);
            let row = parseInt(chunk[0] + chunk[5], 2);
            let col = parseInt(chunk.substring(1, 5), 2);
            let val = S_BOXES[i][(row * 16) + col];
            output32 += val.toString(2).padStart(4, '0');
        }
        return output32;
    }

    function hexToAscii(hex) {
        let str = '';
        for (let i = 0; i < hex.length; i += 2) {
            let part = hex.substr(i, 2);
            if (part.length < 2) break;
            let charCode = parseInt(part, 16);
            if (!isNaN(charCode) && charCode >= 32 && charCode <= 126) {
                str += String.fromCharCode(charCode);
            } else {
                str += ' ';
            }
        }
        return str;
    }

    function asciiToHex(str) {
        let hex = '';
        for (let i = 0; i < str.length; i++) {
            hex += str.charCodeAt(i).toString(16).toUpperCase().padStart(2, '0');
        }
        return hex;
    }

    function changeInputMode(mode) {
        const labelPlaintext = document.getElementById('labelPlaintext');
        const labelKey = document.getElementById('labelKey');
        const plaintext = document.getElementById('plaintext');
        const key = document.getElementById('key');
        
        if (mode === 'ascii') {
            labelPlaintext.innerHTML = '<i class="fa-regular fa-keyboard"></i> Texto Plano <span class="input-hint">(Texto ASCII - 8 caracteres)</span>';
            labelKey.innerHTML = '<i class="fa-solid fa-key"></i> Clave <span class="input-hint">(Texto ASCII - 8 caracteres)</span>';
            
            plaintext.maxLength = 8;
            key.maxLength = 8;
            plaintext.placeholder = "Ej: hola1234";
            key.placeholder = "Ej: clave123";
            
            // Convertir valores actuales a ASCII
            let ptAscii = hexToAscii(plaintext.value).trim();
            let kAscii = hexToAscii(key.value).trim();
            plaintext.value = ptAscii.length >= 2 ? ptAscii.substring(0, 8) : "mensaje1";
            key.value = kAscii.length >= 2 ? kAscii.substring(0, 8) : "clave123";
            
            // Quitar restricción de hexadecimal
            plaintext.oninput = null;
            key.oninput = null;
        } else {
            labelPlaintext.innerHTML = '<i class="fa-solid fa-hashtag"></i> Texto Plano <span class="input-hint">(Hex - 16 caracteres)</span>';
            labelKey.innerHTML = '<i class="fa-solid fa-key"></i> Clave <span class="input-hint">(Hex - 16 caracteres)</span>';
            
            plaintext.maxLength = 16;
            key.maxLength = 16;
            plaintext.placeholder = "Ej: 0123456789abcdef";
            key.placeholder = "Ej: 133457799bbcdff1";
            
            // Convertir valores actuales a Hex
            plaintext.value = asciiToHex(plaintext.value).substring(0, 16);
            key.value = asciiToHex(key.value).substring(0, 16);
            
            // Volver a activar la restricción hexadecimal
            plaintext.oninput = function() {
                this.value = this.value.replace(/[^0-9a-fA-F]/g, '');
            };
            key.oninput = function() {
                this.value = this.value.replace(/[^0-9a-fA-F]/g, '');
            };
        }
        
        // Recalcular automáticamente al cambiar el modo
        calcularDES();
    }

    function calcularDES() {
        let pTextHex;
        let keyHex;
        
        // Determinar el modo de entrada activo
        let mode = document.querySelector('input[name="inputMode"]:checked').value;
        if (mode === 'ascii') {
            let ptVal = document.getElementById('plaintext').value.substring(0, 8).padEnd(8, ' ');
            let keyVal = document.getElementById('key').value.substring(0, 8).padEnd(8, ' ');
            pTextHex = asciiToHex(ptVal);
            keyHex = asciiToHex(keyVal);
        } else {
            pTextHex = document.getElementById('plaintext').value.trim().toUpperCase().padEnd(16, '0');
            keyHex = document.getElementById('key').value.trim().toUpperCase().padEnd(16, '0');
        }
        
        let tbody = document.getElementById('resultsTable');
        tbody.innerHTML = '';

        // 1. Generación de Sub-claves
        let keyBin = hexToBin(keyHex);
        let pc1Key = permute(keyBin, PC1);
        let C = pc1Key.substring(0, 28);
        let D = pc1Key.substring(28, 56);
        let subKeys = [];

        for(let i=0; i<16; i++) {
            C = leftShift(C, SHIFTS[i]);
            D = leftShift(D, SHIFTS[i]);
            let K_i = permute(C + D, PC2);
            subKeys.push(K_i);
        }

        // 2. Proceso de Cifrado (Rondas)
        let ptBin = hexToBin(pTextHex);
        let M = permute(ptBin, IP);
        let L = M.substring(0, 32);
        let R = M.substring(32, 64);

        let row0 = `<tr>
            <td><span class="badge badge-start"><i class="fa-solid fa-play"></i> 0 (Inicial)</span></td>
            <td>${binToHex(L)}</td>
            <td>${binToHex(R)}</td>
            <td><span class="empty-val">-</span></td>
        </tr>`;
        tbody.innerHTML += row0;

        for(let i=0; i<16; i++) {
            let prevL = L;
            let prevR = R;
            let K_i = subKeys[i];

            let E_R = permute(prevR, E_BOX);
            let xor1 = xor(E_R, K_i);
            let sboxOut = applySBoxes(xor1);
            let fOut = permute(sboxOut, P_BOX);

            L = prevR;
            R = xor(prevL, fOut);

            let isLast = (i === 15);
            let row = `<tr>
                <td>
                    ${isLast 
                        ? `<span class="badge badge-end"><i class="fa-solid fa-flag-checkered"></i> 16 (Final)</span>` 
                        : `<span class="round-num">${i+1}</span>`}
                </td>
                <td>${binToHex(L)}</td>
                <td>${binToHex(R)}</td>
                <td><span class="key-val">${binToHex(K_i)}</span></td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    window.onload = calcularDES;
</script>

</body>
</html>
